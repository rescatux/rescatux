label live-autodetect
	menu label ^Live system (auto)
	menu default
	com32 ifcpu64.c32
	append live-amd64 -- live-686 -- live-686

label live-failsafe-autodetect
	menu label Live system (auto fail-safe mode)
	menu default
	com32 ifcpu64.c32
	append live-amd64-failsafe -- live-686-failsafe -- live-686-failsafe
